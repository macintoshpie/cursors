<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>WebGL Demo</title>
  <script src="webgl-demo.js" type="module"></script>
</head>

<body>
  <video id="my-video" controls autoplay></video>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    if (Hls.isSupported()) {
      var video = document.getElementById('my-video');
      var hls = new Hls();
      hls.loadSource('https://cors-anywhere.herokuapp.com/https://sfs-lr-40.dot.ga.gov/rtplive/GWIN-CCTV-PIB_HolcombBridgeRd-029_122-S/playlist.m3u8');
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // for safari
      video.src = 'https://cors-anywhere.herokuapp.com/https://sfs-lr-40.dot.ga.gov/rtplive/GWIN-CCTV-PIB_HolcombBridgeRd-029_122-S/playlist.m3u8';
      video.addEventListener('loadedmetadata', function () {
        video.play();
      });
    }
  </script>

</body>

</html>
